<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>漢字タイピングGG（GitHub Pages）</title>

  <!-- Tailwind / React / Babel -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <meta name="color-scheme" content="light only"/>
</head>
<body class="bg-slate-50">
  <div id="root" class="min-h-screen"></div>

  <script type="text/babel" data-presets="react">
    const {useEffect, useMemo, useRef, useState} = React;

    // ========= ユーティリティ =========
    const Modes = { READING:"READING", KANJI:"KANJI", PRACTICE:"PRACTICE", WRITETEST:"WRITETEST" };

    const LS_KEY_SELECTED = "kanji-typing:selectedDatasets";

    const fetchJson = async (path) => {
      const res = await fetch(path, { cache: "no-store" });
      if (!res.ok) throw new Error(`${path} の取得に失敗（${res.status}）`);
      return await res.json();
    };

    const uniqByTerm = (items) => {
      const map = new Map();
      for (const it of items) map.set(it.term, it); // 後勝ち
      return Array.from(map.values());
    };

    const shuffle = (arr) => {
      const a = [...arr];
      for (let i=a.length-1;i>0;i--) {
        const j = Math.floor(Math.random()*(i+1));
        [a[i],a[j]]=[a[j],a[i]];
      }
      return a;
    };

    const hiraFromKana = (s) =>
      s.replace(/[\u3000]/g," ").trim()
       .replace(/[\u30a1-\u30f6]/g, ch => String.fromCharCode(ch.charCodeAt(0)-0x60));

    const normalizeAnswer = (input, mode) => {
      if (mode===Modes.READING) return hiraFromKana(input).replace(/\s+/g,"");
      return input.replace(/[\u3000\s]/g,"").trim();
    };

    // ========= データ選択UI + アプリ =========
    function App() {
      const [manifest, setManifest] = useState(null);
      const [sel, setSel] = useState([]);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState("");
      const [db, setDb] = useState([]);

      useEffect(() => {
        (async () => {
          try {
            const m = await fetchJson("./db-manifest.json");
            setManifest(m);
            const saved = JSON.parse(localStorage.getItem(LS_KEY_SELECTED) || "[]");
            const valid = Array.isArray(saved) ? saved.filter(id => m.some(e=>e.id===id)) : [];
            setSel(valid.length ? valid : m.slice(0,1).map(e=>e.id));
          } catch (e) {
            setError("db-manifest.json を読み込めませんでした。配置とJSON構造を確認してください。");
          }
        })();
      }, []);

      const loadSelected = async () => {
        if (!manifest) return;
        if (sel.length===0) { setError("少なくとも1つ選択してください。"); return; }
        setError(""); setLoading(true);
        try {
          const files = manifest.filter(m => sel.includes(m.id));
          const all = [];
          for (const f of files) {
            const arr = await fetchJson(f.path);
            if (!Array.isArray(arr)) throw new Error(`${f.path} は配列ではありません`);
            all.push(...arr);
          }
          const merged = uniqByTerm(all);
          if (merged.length === 0) throw new Error("選択したデータが空でした。");
          setDb(merged);
          localStorage.setItem(LS_KEY_SELECTED, JSON.stringify(sel));
        } catch (e) {
          setError(e.message || String(e));
        } finally {
          setLoading(false);
        }
      };

      if (error) {
        return (
          <div className="max-w-3xl mx-auto p-6">
            <h1 className="text-2xl font-bold mb-3">読み込みエラー</h1>
            <p className="text-red-600 whitespace-pre-wrap">{error}</p>
          </div>
        );
      }

      if (!manifest || db.length === 0) {
        return (
          <div className="max-w-3xl mx-auto p-6">
            <h1 className="text-2xl md:text-3xl font-bold mb-4">データセットを選択</h1>
            <div className="grid gap-4 rounded-2xl border bg-white p-6 shadow-sm">
              {manifest ? (
                <div className="grid gap-3">
                  {manifest.map(m => (
                    <label key={m.id} className="flex items-center gap-3">
                      <input
                        type="checkbox"
                        className="size-4"
                        checked={sel.includes(m.id)}
                        onChange={(e) => {
                          setSel(prev => e.target.checked ? [...prev,m.id] : prev.filter(x=>x!==m.id));
                        }}
                      />
                      <span className="font-medium">{m.label}</span>
                      <span className="text-xs text-slate-500">({m.path})</span>
                    </label>
                  ))}
                </div>
              ) : (
                <p className="text-slate-600">db-manifest.json を取得中…</p>
              )}

              <div className="flex items-center gap-3">
                <button
                  className="px-4 py-2 rounded-xl bg-slate-900 text-white disabled:opacity-50"
                  onClick={loadSelected}
                  disabled={loading || !manifest}
                >
                  {loading ? "読み込み中…" : "選択したデータを読み込む"}
                </button>
                {sel.length>0 && (
                  <span className="text-sm text-slate-600">選択：{sel.length}件</span>
                )}
              </div>

              <p className="text-sm text-slate-500">
                ※ マニフェストに項目を追加すれば、新しいJSONファイルも選べます。  
                フォーマット：<code>[&#123;term, reading, meaning&#125;,...]</code>
              </p>
            </div>
          </div>
        );
      }

      return <KanjiTypingApp initialDB={db} onChangeDataset={()=>setDb([])} manifest={manifest} sel={sel} />;
    }

    // ========= アプリ本体 =========
    function KanjiTypingApp({ initialDB, onChangeDataset, manifest, sel }) {
      const [mode, setMode] = useState(Modes.READING);
      const [db, setDb]   = useState(initialDB);

      // 既存モードの並び
      const makeOrder = (m, list) => (m === Modes.WRITETEST ? list.map((_,i)=>i) : shuffle(list.map((_,i)=>i)));

      const [order, setOrder] = useState(() => makeOrder(mode, db));
      const [idx, setIdx] = useState(0);

      // 既存モード用
      const [input, setInput] = useState("");
      const [status, setStatus] = useState("idle");
      const [streak, setStreak] = useState(0);
      const [cleared, setCleared] = useState(false);
      const [miss, setMiss] = useState(null);

      // ===== モード4（ラウンド方式）用 =====
      // 現在ラウンドの出題プール（db の絶対 index 配列）
      const [wtPool, setWtPool] = useState(()=> db.map((_,i)=>i));
      // プール内位置
      const [wtPos, setWtPos] = useState(0);
      // このラウンドで答えを表示してしまった（＝間違い）絶対 index 集合
      const [wtWrong, setWtWrong] = useState(()=>new Set());
      // ラウンド番号（1開始）
      const [wtRound, setWtRound] = useState(1);
      // ラウンド終了フラグ
      const [wtFinished, setWtFinished] = useState(false);
      // トグル表示
      const [showAnswerNow, setShowAnswerNow] = useState(false);

      const inputRef = useRef(null);

      // DB 変更やモード変更時の初期化
      useEffect(()=>{ 
        const nextOrder = makeOrder(mode, db);
        setOrder(nextOrder);
        setIdx(0); setInput(""); setStatus("idle"); setStreak(0); setCleared(false); setMiss(null);

        if (mode === Modes.WRITETEST) {
          setWtPool(db.map((_,i)=>i)); // 上から順
          setWtPos(0);
          setWtWrong(new Set());
          setWtRound(1);
          setWtFinished(false);
          setShowAnswerNow(false);
        }
      }, [db, mode]);

      // 現在問題
      const currentIndex = mode===Modes.WRITETEST ? wtPool[wtPos] : order[idx];
      const current = useMemo(()=> db[currentIndex], [db, currentIndex]);
      const total = db.length;

      // === 既存モードの移動 ===
      const goNextNormal = () => setIdx(v => v+1>=order.length ? 0 : v+1);
      const goPrevNormal = () => setIdx(v => v-1<0 ? order.length-1 : v-1);

      // === モード4の移動 ===
      const goNextWT = () => {
        setShowAnswerNow(false);
        setWtPos(v => {
          if (v+1 >= wtPool.length) { setWtFinished(true); return v; }
          return v+1;
        });
      };
      const goPrevWT = () => { setShowAnswerNow(false); setWtPos(v => Math.max(0, v-1)); };

      useEffect(()=>{ 
        setInput(""); setStatus("idle");
        if(mode!==Modes.PRACTICE) inputRef.current?.focus();
      }, [idx, wtPos, mode]);

      const restartRound = () => {
        const nextOrder = makeOrder(mode, db);
        setOrder(nextOrder);
        setIdx(0); setInput(""); setStatus("idle"); setStreak(0); setCleared(false); setMiss(null);

        // モード4も全面リセット
        setWtPool(db.map((_,i)=>i));
        setWtPos(0);
        setWtWrong(new Set());
        setWtRound(1);
        setWtFinished(false);
        setShowAnswerNow(false);

        if(mode!==Modes.PRACTICE) inputRef.current?.focus();
      };

      // 既存モード：判定
      const checkAnswer = () => {
        if (mode===Modes.PRACTICE || mode===Modes.WRITETEST) return;
        const user = normalizeAnswer(input, mode);
        const ok = mode===Modes.READING
          ? user === normalizeAnswer(current.reading, mode)
          : user === normalizeAnswer(current.term, mode);
        if (ok) {
          const next = streak+1;
          setStatus("correct"); setStreak(next); setInput("");
          if (idx+1>=order.length && next===total) { setCleared(true); return; }
          setTimeout(goNextNormal, 500);
        } else {
          setStatus("wrong"); setMiss({ item: current, mode });
        }
      };

      // ▼▼ モード4：答え表示トグル（初回表示時に間違い登録） ▼▼
      const toggleAnswer = () => {
        setShowAnswerNow(prev => {
          const next = !prev;
          if (!prev) {
            setWtWrong(prevSet => {
              if (prevSet.has(currentIndex)) return prevSet;
              const n = new Set(prevSet); n.add(currentIndex); return n;
            });
          }
          return next;
        });
      };

      // モード4：キー操作（← → Space）
      useEffect(()=>{
        if (mode !== Modes.WRITETEST) return;
        const onKey = (e) => {
          if (wtFinished) return;
          if (e.key === "ArrowRight") { e.preventDefault(); goNextWT(); }
          if (e.key === "ArrowLeft")  { e.preventDefault(); goPrevWT(); }
          if (e.key === " ") { e.preventDefault(); toggleAnswer(); }
        };
        window.addEventListener("keydown", onKey);
        return () => window.removeEventListener("keydown", onKey);
      }, [mode, wtFinished, wtPos, currentIndex]);

      const progress =
        mode===Modes.PRACTICE ? Math.round(((idx+1)/total)*100)
        : mode===Modes.WRITETEST ? Math.round(((Math.min(wtPos+1, wtPool.length))/wtPool.length)*100)
        : Math.round((streak/total)*100);

      // 既存モードのクリア画面
      if (cleared && mode!==Modes.PRACTICE && mode!==Modes.WRITETEST) {
        return (
          <div className="min-h-screen flex flex-col items-center justify-center bg-emerald-50 text-emerald-800">
            <h1 className="text-5xl font-bold mb-6 animate-bounce">🎉クリア！🎉</h1>
            <p className="text-lg mb-8">全{total}問を <span className="font-bold">連続正解</span> しました！</p>
            <button className="px-6 py-3 rounded-xl bg-emerald-700 text-white hover:bg-emerald-800" onClick={restartRound}>
              もう一度チャレンジ
            </button>
          </div>
        );
      }

      // モード4：ラウンド結果画面
      if (mode===Modes.WRITETEST && wtFinished) {
        const wrongCount = wtWrong.size;
        const correctCount = wtPool.length - wrongCount;
        const rate = wtPool.length > 0 ? Math.round((correctCount/wtPool.length)*100) : 0;
        const wrongItems = Array.from(wtWrong).map(i => db[i]);

        // クリア判定（このラウンドで答えを一度も見ていない）
        if (wrongCount === 0) {
          return (
            <div className="min-h-screen flex flex-col items-center justify-center bg-emerald-50 text-emerald-800 p-6">
              <h1 className="text-5xl font-bold mb-4">🎉クリア！🎉</h1>
              <p className="text-lg mb-6">ラウンド {wtRound} を<strong>答えを見ずに</strong>全問クリアしました！</p>
              <div className="grid gap-3 text-slate-700 bg-white p-6 rounded-2xl border shadow">
                <div>このラウンドの問題数：{wtPool.length}</div>
                <div>正答率：{rate}%</div>
              </div>
              <div className="mt-8 flex gap-3">
                <button className="px-5 py-3 rounded-xl bg-slate-900 text-white" onClick={restartRound}>最初から</button>
                <button className="px-5 py-3 rounded-xl border bg-white" onClick={()=>{
                  // もう一度同じ全範囲でテスト
                  setWtPool(db.map((_,i)=>i));
                  setWtPos(0);
                  setWtWrong(new Set());
                  setWtRound(1);
                  setWtFinished(false);
                  setShowAnswerNow(false);
                }}>同じ範囲でもう一度</button>
              </div>
            </div>
          );
        }

        // 未クリア → 間違いのみで再テスト案内
        return (
          <div className="min-h-screen p-6">
            <div className="max-w-4xl mx-auto grid gap-6">
              <header className="flex items-center justify-between">
                <h1 className="text-2xl md:text-3xl font-bold">漢字書き取りテスト 結果（ラウンド {wtRound}）</h1>
                <div className="text-sm text-slate-600">このラウンドの問題数：{wtPool.length}</div>
              </header>

              <div className="grid md:grid-cols-3 gap-4">
                <div className="rounded-2xl border bg-white p-5 text-center">
                  <div className="text-xs text-slate-500">正答（答えを見なかった）</div>
                  <div className="text-3xl font-extrabold mt-1 text-emerald-600">{correctCount}</div>
                </div>
                <div className="rounded-2xl border bg-white p-5 text-center">
                  <div className="text-xs text-slate-500">不正解（答えを表示）</div>
                  <div className="text-3xl font-extrabold mt-1 text-rose-600">{wrongCount}</div>
                </div>
                <div className="rounded-2xl border bg-white p-5 text-center">
                  <div className="text-xs text-slate-500">正答率</div>
                  <div className="text-3xl font-extrabold mt-1">{rate}%</div>
                </div>
              </div>

              <div className="rounded-2xl border bg-white p-5">
                <h2 className="text-lg font-bold mb-3">書けなかった漢字（次ラウンドで再テスト）</h2>
                <ul className="grid gap-3">
                  {wrongItems.map((it, i)=>(
                    <li key={i} className="p-4 rounded-xl bg-slate-50 border">
                      <div className="text-2xl font-extrabold">{it.term}</div>
                      <div className="text-sm text-slate-600">読み：{it.reading}</div>
                      <div className="text-sm text-slate-600">意味：{it.meaning}</div>
                    </li>
                  ))}
                </ul>
              </div>

              <div className="flex items-center gap-3">
                <button className="px-5 py-3 rounded-xl bg-slate-900 text-white"
                  onClick={()=>{
                    // 間違いだけで次ラウンドを開始
                    const nextPool = Array.from(wtWrong);
                    setWtPool(nextPool);
                    setWtPos(0);
                    setWtWrong(new Set());
                    setWtRound(r => r+1);
                    setWtFinished(false);
                    setShowAnswerNow(false);
                  }}>
                  再テスト：間違いだけ（ラウンド {wtRound+1} 開始）
                </button>
                <button className="px-5 py-3 rounded-xl border bg-white" onClick={restartRound}>最初からやり直す</button>
              </div>

              <footer className="text-center text-xs text-slate-500">
                <p>© {new Date().getFullYear()} 漢字タイピング</p>
              </footer>
            </div>
          </div>
        );
      }

      // ===== 通常画面（各モード） =====
      return (
        <div className="relative min-h-screen bg-slate-50 text-slate-900 p-6">
          <div className="max-w-4xl mx-auto grid gap-6">
            <header className="flex flex-wrap items-center justify-between gap-3">
              <h1 className="text-2xl md:text-3xl font-bold">漢字タイピング</h1>
              <div className="flex items-center gap-2">
                <select
                  aria-label="モード選択"
                  className="px-3 py-2 rounded-xl border border-slate-300 bg-white shadow-sm"
                  value={mode}
                  onChange={(e)=>{ setMode(e.target.value); }}
                >
                  <option value={Modes.READING}>モード1：漢字→読み</option>
                  <option value={Modes.KANJI}>モード2：意味→漢字</option>
                  <option value={Modes.PRACTICE}>モード3：漢字書き取り練習</option>
                  <option value={Modes.WRITETEST}>モード4：漢字書き取りテスト</option>
                </select>
                <button className="px-3 py-2 rounded-xl bg-slate-900 text-white hover:opacity-90" onClick={restartRound}>
                  リセット
                </button>
                <button
                  className="px-3 py-2 rounded-xl border border-slate-300 bg-white hover:bg-slate-50"
                  onClick={onChangeDataset}
                  title="データセット選択に戻る"
                >データ変更</button>
              </div>
            </header>

            <div className="rounded-2xl border bg-white p-4 shadow-sm">
              <div className="flex flex-wrap items-center gap-3 text-sm">
                {mode!==Modes.WRITETEST ? (
                  <>
                    <span className="px-2 py-1 rounded-full bg-slate-100">
                      {mode===Modes.PRACTICE ? "表示" : "問題"} {idx+1} / {total}
                    </span>
                    {mode!==Modes.PRACTICE && (
                      <span className="px-2 py-1 rounded-full bg-slate-100">連続正解 {streak}</span>
                    )}
                    <span className="ml-auto px-2 py-1 rounded-full bg-slate-900 text-white">進捗 {progress}%</span>
                  </>
                ) : (
                  <>
                    <span className="px-2 py-1 rounded-full bg-slate-100">ラウンド {wtRound}</span>
                    <span className="px-2 py-1 rounded-full bg-slate-100">
                      問題 {Math.min(wtPos+1, wtPool.length)} / {wtPool.length}
                    </span>
                    <span className="ml-auto px-2 py-1 rounded-full bg-slate-900 text-white">進捗 {progress}%</span>
                  </>
                )}
              </div>
              <div className="mt-3 text-xs text-slate-500">
                使用中データ：{sel.join(", ")}
              </div>
            </div>

            <main className="rounded-2xl border bg-white p-6 shadow-sm">
              {/* モード3：練習 */}
              {mode===Modes.PRACTICE && (
                <div className="grid gap-6 text-center">
                  <div>
                    <div className="text-sm font-medium text-slate-500 mb-1">漢字（お手本）</div>
                    <div className="text-6xl md:text-7xl font-extrabold tracking-wide mt-1">{current.term}</div>
                  </div>
                  <div className="grid gap-2">
                    <div className="text-sm font-medium text-slate-500">読み</div>
                    <div className="text-3xl md:text-4xl font-bold">{current.reading}</div>
                  </div>
                  <div className="grid gap-2">
                    <div className="text-sm font-medium text-slate-500">意味</div>
                    <div className="text-2xl md:text-3xl font-semibold leading-relaxed">{current.meaning}</div>
                  </div>
                  <div className="mt-4 flex items-center justify-center gap-3">
                    <button className="px-6 py-3 rounded-xl bg-slate-900 text-white hover:opacity-90" onClick={()=>setIdx(v => v+1>=order.length ? 0 : v+1)}>
                      次へ（Space / → / Enter）
                    </button>
                  </div>
                </div>
              )}

              {/* モード1：漢字→読み */}
              {mode===Modes.READING && (
                <div className="grid gap-4">
                  <div className="text-center">
                    <div className="text-sm font-medium text-slate-500">漢字</div>
                    <div className="text-4xl md:text-5xl font-bold tracking-wide mt-1">{current.term}</div>
                  </div>
                  <label className="grid gap-2">
                    <span className="text-sm text-slate-600">読み（ひらがな／カタカナ可）</span>
                    <input
                      ref={inputRef} type="text" value={input}
                      onChange={(e)=>setInput(e.target.value)}
                      onKeyDown={(e)=>{ if (e.key==="Enter") { e.preventDefault(); checkAnswer(); } }}
                      disabled={status==="wrong" && !!miss}
                      className={`px-4 py-3 rounded-xl border focus:outline-none focus:ring-4 transition ${
                        status==="wrong" ? "border-red-400 ring-red-100" : "border-slate-300 focus:ring-slate-100"
                      } ${status==="wrong" && !!miss ? "opacity-60 cursor-not-allowed":""}`}
                      placeholder="れい：はくぶつかん"
                      autoCapitalize="none" autoComplete="off" autoCorrect="off" spellCheck={false}
                    />
                  </label>
                  <div className="mt-5">
                    <button className="px-4 py-2 rounded-xl bg-slate-900 text-white hover:opacity-90"
                      onClick={checkAnswer} disabled={status==="wrong" && !!miss}>
                      判定（Enter）
                    </button>
                    {status==="correct" && <span className="text-sm text-emerald-600 ml-2">正解！</span>}
                  </div>
                </div>
              )}

              {/* モード2：意味→漢字 */}
              {mode===Modes.KANJI && (
                <div className="grid gap-4">
                  <div className="text-center">
                    <div className="text-sm font-medium text-slate-500">意味</div>
                    <div className="text-xl md:text-2xl font-semibold tracking-wide mt-1">{current.meaning}</div>
                  </div>
                  <label className="grid gap-2">
                    <span className="text-sm text-slate-600">漢字で入力</span>
                    <input
                      ref={inputRef} type="text" value={input}
                      onChange={(e)=>setInput(e.target.value)}
                      onKeyDown={(e)=>{ if (e.key==="Enter") { e.preventDefault(); checkAnswer(); } }}
                      disabled={status==="wrong" && !!miss}
                      className={`px-4 py-3 rounded-xl border focus:outline-none focus:ring-4 transition ${
                        status==="wrong" ? "border-red-400 ring-red-100" : "border-slate-300 focus:ring-slate-100"
                      } ${status==="wrong" && !!miss ? "opacity-60 cursor-not-allowed":""}`}
                      placeholder="れい：博物館"
                      autoCapitalize="none" autoComplete="off" autoCorrect="off" spellCheck={false}
                    />
                  </label>
                  <div className="mt-5">
                    <button className="px-4 py-2 rounded-xl bg-slate-900 text-white hover:opacity-90"
                      onClick={checkAnswer} disabled={status==="wrong" && !!miss}>
                      判定（Enter）
                    </button>
                    {status==="correct" && <span className="text-sm text-emerald-600 ml-2">正解！</span>}
                  </div>
                </div>
              )}

              {/* モード4：漢字書き取りテスト（ラウンド方式） */}
              {mode===Modes.WRITETEST && !wtFinished && (
                <div className="grid gap-6">
                  <div className="grid gap-1 text-center">
                    <div className="text-xs font-medium text-slate-500">読み</div>
                    <div className="text-3xl md:text-4xl font-bold">{current.reading}</div>
                  </div>
                  <div className="grid gap-1 text-center">
                    <div className="text-xs font-medium text-slate-500">意味</div>
                    <div className="text-xl md:text-2xl font-semibold leading-relaxed">{current.meaning}</div>
                  </div>

                  <label className="grid gap-2">
                    <span className="text-sm text-slate-600">（任意）漢字で入力してみよう</span>
                    <input
                      ref={inputRef} type="text" value={input}
                      onChange={(e)=>setInput(e.target.value)}
                      className="px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-4 focus:ring-slate-100"
                      placeholder="ここに自分で書いてみる（採点はしません）"
                      autoCapitalize="none" autoComplete="off" autoCorrect="off" spellCheck={false}
                    />
                  </label>

                  <div className="flex flex-wrap items-center justify-between gap-3">
                    <div className="flex items-center gap-2">
                      <button
                        className="px-4 py-2 rounded-xl border bg-white hover:bg-slate-50"
                        onClick={goPrevWT}
                        disabled={wtPos===0}
                        title="前の問題（←）"
                      >← 前の問題</button>

                      <button
                        className="px-4 py-2 rounded-xl bg-slate-900 text-white hover:opacity-90"
                        onClick={goNextWT}
                        title="次の問題（→）"
                      >次の問題 →</button>
                    </div>

                    <button
                      className="px-4 py-2 rounded-xl border bg-white hover:bg-slate-50"
                      onClick={toggleAnswer}
                      title="スペースキーでも切り替えできます"
                    >{showAnswerNow ? "答えを隠す（Space）" : "答えを見る（Space）"}</button>
                  </div>

                  {showAnswerNow && (
                    <div className="mt-4 p-6 rounded-2xl bg-amber-50 border-amber-200 border text-center">
                      <div className="text-xs text-amber-700 mb-2">答え</div>
                      <div className="text-6xl md:text-7xl font-extrabold tracking-wide text-amber-900">{current.term}</div>
                    </div>
                  )}

                  <div className="mt-4 p-4 rounded-xl bg-slate-50 border text-sm text-slate-600">
                    <div className="flex flex-wrap gap-3 items-center">
                      <span className="font-medium">操作：</span>
                      <span>←/→：前後の問題移動</span>
                      <span>Space：答えを表示／隠す（※初回表示時に不正解として記録）</span>
                    </div>
                  </div>
                </div>
              )}
            </main>

            {/* 既存モード：不正解ダイアログ */}
            {miss && mode!==Modes.PRACTICE && mode!==Modes.WRITETEST && (
              <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-6">
                <div className="max-w-2xl w-full rounded-2xl bg-white shadow-xl p-8 text-center">
                  <div className="text-sm text-slate-500 mb-2">正解は</div>
                  {miss.mode===Modes.READING ? (
                    <div>
                      <div className="text-5xl md:text-6xl font-extrabold tracking-wide mb-3">{miss.item.reading}</div>
                      <div className="text-base text-slate-600">（漢字：<span className="font-semibold">{miss.item.term}</span>）</div>
                    </div>
                  ) : (
                    <div>
                      <div className="text-5xl md:text-6xl font-extrabold tracking-wide mb-3">{miss.item.term}</div>
                      <div className="text-base text-slate-600">（意味：{miss.item.meaning}）</div>
                    </div>
                  )}
                  <div className="mt-8 flex items-center justify-center gap-3">
                    <button className="px-6 py-3 rounded-xl bg-slate-900 text-white hover:opacity-90" onClick={restartRound} autoFocus>
                      再挑戦（最初から）
                    </button>
                  </div>
                </div>
              </div>
            )}

            <footer className="text-center text-xs text-slate-500">
              <p>© {new Date().getFullYear()} 漢字タイピング</p>
            </footer>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App/>);
  </script>

  <noscript>このアプリを使うにはJavaScriptを有効にしてください。</noscript>
</body>
</html>
